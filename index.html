<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VTT Game 3D - Course Extrême</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            overflow: hidden;
            background-color: #000;
        }
        
        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }
        
        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 12px;
        }
        
        #hud div {
            margin: 5px 0;
        }
        
        .bar {
            width: 150px;
            height: 15px;
            background: #222;
            border: 1px solid #00ff00;
            margin-top: 3px;
        }
        
        .bar-fill {
            height: 100%;
            background: #00ff00;
            transition: width 0.1s;
        }
        
        #controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            color: #00ff00;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px;
            border: 2px solid #00ff00;
            border-radius: 5px;
            font-size: 12px;
            font-family: 'Courier New', monospace;
        }
        
        .control-item {
            margin: 8px 0;
        }
        
        .key {
            background: #00ff00;
            color: #000;
            padding: 2px 6px;
            border-radius: 3px;
            font-weight: bold;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <div id="hud">
        <div>===== VTT GAME 3D =====</div>
        <div id="bike-info">Vélo: Mountain</div>
        <div id="weapon-info">Arme: Pistol</div>
        <div>Argent: ∞</div>
        <div>Santé:</div>
        <div class="bar"><div class="bar-fill" id="health-bar" style="width: 100%"></div></div>
        <div>Endurance:</div>
        <div class="bar"><div class="bar-fill" id="stamina-bar" style="width: 100%"></div></div>
        <div id="speed-info">Vitesse: 0 km/h</div>
        <div id="ammo-info">Munitions: 999</div>
    </div>
    
    <div id="controls">
        <div class="control-item"><span class="key">A</span> Pédaler (Accélérer)</div>
        <div class="control-item"><span class="key">B</span> Freiner</div>
        <div class="control-item"><span class="key">D</span> Drain (Boost Rapidité)</div>
        <div class="control-item"><span class="key">X</span> Sauter</div>
        <div class="control-item"><span class="key">Q/E</span> Tourner</div>
        <div class="control-item"><span class="key">SOURIS</span> Tirer</div>
    </div>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
